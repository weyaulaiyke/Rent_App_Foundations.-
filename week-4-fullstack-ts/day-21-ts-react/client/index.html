<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/remote-r.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REMOTE</title>

    <script>
        (function() {
            var preference = "system";

            try {
                preference =
                    localStorage.getItem("remote-theme") || "system";
            } catch (_) {}

            var dark =
                preference === "dark" ||
                (
                    preference !== "light" &&
                    window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches
                );

            var theme = dark ? "dark" : "light";

            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        })();
    </script>

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
