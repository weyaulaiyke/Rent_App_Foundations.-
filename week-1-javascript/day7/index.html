<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widith-device-width, inital-scale=1.0">
    <title>Landlord Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="sidebar">
        <h2>Rent App</h2>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Properties</a>
            <a href="#">Renters</a>
        </nav>
    </aside>
    <main class="main content">
        <header class="top-bar">
            <h1>Landlord Dashboard</h1>
        </header>
        <section class="summary cards">
            <div class="card">
                <h3>Total Units</h3>
                <p>24</p>
            </div>
            <div class="card">
                <h3>Occupied Units</h3>
                <p>18</p>
            </div>
            <div class="card">
                <h3>Rent Collected</h3>
                <p>UGX 8,500,000</p>
            </div>
            <div class="card">
                <h3>Arrears</h3>
                <p>UGX 1,200,000</p>
            </div>
        </section>
        <section class="renter-table">
            <h2>Renters</h2>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Unit</th>
                    <th>Status</th>
                </tr>
                <tr>
                    <td>John</td>
                    <td>A1</td>
                    <td>Paid</td>
                </tr>
                <tr>
                    <td>Mary</td>
                    <td>A2</td>
                    <td>Arrears</td>
                </tr>
            </table>
        </section>
    </main>
</body>

</html>
